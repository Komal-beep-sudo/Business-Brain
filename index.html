<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Business Brain: clickable prototype of an AI business assistant for Indian MSMEs (sample data).">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Business Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
/* Layout: mobile-first app shell. Sidebar on desktop, bottom nav on phones; summary first, detail below. */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#EDEFF6; --fg:#121626; --muted:#5A6177; --line:#E1E4EE;
  --accent:#2A3CC2; --accent-soft:#E7EAFB; --accent-fg:#FFFFFF;
  --saffron:#C97A10; --saffron-soft:#FCF0DD;
  --good:#16804E; --good-soft:#E2F3E9; --warn:#9C6408; --warn-soft:#FAEFD9; --bad:#BE332D; --bad-soft:#FBE6E4;
  --wa-bg:#EFEAE2; --wa-in:#FFFFFF; --wa-out:#D9FDD3; --wa-head:#0B5C50; --wa-fg:#111B21;
  --shadow:0 1px 2px rgba(18,22,38,.05),0 10px 30px rgba(18,22,38,.07);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1018; --surface:#151925; --surface-2:#1C2131; --fg:#E8EBF4; --muted:#9AA1B6; --line:#262C3D;
  --accent:#8193FF; --accent-soft:#1F2650; --accent-fg:#0D1018;
  --saffron:#F0AE4F; --saffron-soft:#3A2B12;
  --good:#4FC48C; --good-soft:#12301F; --warn:#E6B657; --warn-soft:#352812; --bad:#F2716B; --bad-soft:#3A1715;
  --wa-bg:#0B141A; --wa-in:#202C33; --wa-out:#144D37; --wa-head:#1F2C34; --wa-fg:#E9EDEF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1018; --surface:#151925; --surface-2:#1C2131; --fg:#E8EBF4; --muted:#9AA1B6; --line:#262C3D;
  --accent:#8193FF; --accent-soft:#1F2650; --accent-fg:#0D1018;
  --saffron:#F0AE4F; --saffron-soft:#3A2B12;
  --good:#4FC48C; --good-soft:#12301F; --warn:#E6B657; --warn-soft:#352812; --bad:#F2716B; --bad-soft:#3A1715;
  --wa-bg:#0B141A; --wa-in:#202C33; --wa-out:#144D37; --wa-head:#1F2C34; --wa-fg:#E9EDEF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(1.5rem,1.1rem + 1.6vw,2.1rem);line-height:1.15}
h2{font-size:1.15rem;line-height:1.3}
h3{font-size:1rem;font-family:var(--font-body);font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* Buttons & pills */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.btn.badb{background:transparent;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.g2,.g2e,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:899px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--font-display);font-size:clamp(1.3rem,1rem + 1vw,1.75rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.delta{font-size:12.5px;font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}

/* AI insight block */
.insight{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft));border:1px solid transparent;border-radius:var(--r);padding:18px 20px;display:flex;gap:14px}
.spark{flex:none;width:34px;height:34px;border-radius:10px;background:var(--saffron-soft);color:var(--saffron);display:grid;place-items:center}
.insight p{max-width:68ch}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li:last-child{padding-bottom:0}
.dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:8px;background:var(--muted)}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.good{background:var(--good)} .dot.acc{background:var(--accent)}
.li-main{flex:1;min-width:0}
.li-title{font-weight:600}
.li-side{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
@media (max-width:520px){.li{flex-wrap:wrap}.li-side{flex-direction:row;align-items:center;width:100%;justify-content:flex-start;padding-left:20px}}

/* Tables */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:70px}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar>span.good{background:var(--good)} .bar>span.warn{background:var(--warn)}

/* Shell */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid var(--line);background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--font-display);font-size:17px;letter-spacing:-.01em}
.nav-g{display:flex;flex-direction:column;gap:2px}
.nav-g .label{padding:0 10px 6px}
.nav-i{display:flex;align-items:center;gap:10px;border:0;background:transparent;width:100%;text-align:left;padding:8px 10px;border-radius:9px;font-weight:500;color:var(--muted)}
.nav-i:hover{background:var(--surface-2);color:var(--fg)}
.nav-i[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-i svg{flex:none}
.nav-i .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--saffron);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:10px;border-radius:10px;background:var(--surface-2)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .co{font-weight:700}
.top .mob-logo{display:none}
.main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 110px;display:flex;flex-direction:column;gap:20px}
@media (min-width:900px){.main{padding-inline:28px}.top-in{padding-inline:28px}}
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px}
.bnav button[aria-current="page"]{color:var(--accent)}
@media (max-width:899px){.shell{grid-template-columns:minmax(0,1fr)}.side{display:none}.bnav{display:flex}.top .mob-logo{display:grid}}
@media (max-width:600px){.top-in>.grow{flex-basis:calc(100% - 48px)}.top-in label[for="roleSel"]{display:none}#roleSel{flex:1}}
.role-banner{background:var(--saffron-soft);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-h p{margin-top:4px}

/* Sheet / modal / toast */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (min-width:900px){.toast{bottom:28px}}
textarea,input[type=text],input[type=tel],input[type=email],input[type=date],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
textarea{min-height:150px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600}

/* WhatsApp preview */
.phone{max-width:390px;width:100%;margin:0 auto;border-radius:28px;border:8px solid var(--fg);background:var(--wa-bg);overflow:hidden;box-shadow:var(--shadow)}
.wa-head{background:var(--wa-head);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.wa-av{width:34px;height:34px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none;color:#fff}
.wa-body{padding:14px 12px 18px;display:flex;flex-direction:column;gap:8px;min-height:420px}
.wa-msg{background:var(--wa-in);color:var(--wa-fg);border-radius:0 10px 10px 10px;padding:9px 11px 6px;font-size:14px;max-width:92%;white-space:pre-line;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.wa-msg.out{align-self:flex-end;background:var(--wa-out);border-radius:10px 0 10px 10px}
.wa-time{display:block;text-align:right;font-size:11px;opacity:.6;margin-top:2px}
.wa-day{align-self:center;font-size:12px;background:var(--wa-in);color:var(--wa-fg);opacity:.85;padding:3px 10px;border-radius:8px}

/* Chat */
.chat{display:flex;flex-direction:column;gap:14px}
.bubble{max-width:min(720px,100%);border-radius:14px;padding:12px 14px}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-radius:14px 14px 4px 14px;max-width:80%}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;display:flex;flex-direction:column;gap:10px}
.bubble.ai p{max-width:68ch}
.src{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.suggest{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500;text-align:left}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.composer{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
@media (min-width:900px){.composer{bottom:16px}}
.composer input{border:0;background:transparent;padding:10px}
.composer input:focus{outline:none}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* Onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:20px 40px}
.ob-top{max-width:880px;width:100%;margin:0 auto;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.ob-card{max-width:880px;width:100%;margin:22px auto 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
@media (max-width:760px){.ob-card{grid-template-columns:minmax(0,1fr)}.ob-aside{display:none}}
.ob-form{padding:28px 26px;display:flex;flex-direction:column;gap:16px}
.ob-aside{background:var(--accent);color:var(--accent-fg);padding:28px 26px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.ob-aside h2{font-size:1.5rem}
.ob-aside li{margin-bottom:8px}
.ob-aside ul{padding-left:18px;margin:0}
.steps{display:flex;gap:6px;max-width:880px;width:100%;margin:18px auto 0}
.steps span{flex:1;height:4px;border-radius:99px;background:var(--line)}
.steps span.on{background:var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.src-card{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px}
.src-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);flex:none;font-weight:700;font-size:13px}
.proc li{display:flex;gap:10px;align-items:center;padding:8px 0;color:var(--muted)}
.proc li.done{color:var(--fg)}
.proc ul{list-style:none;padding:0;margin:0}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.done .chk{background:var(--good);border-color:var(--good);color:#fff}
.now .chk{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;border-radius:9px;background:var(--surface-2)}
.ageing{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px}
.ageing span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px}
.legend div{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:600px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stage{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.stage .v{font-family:var(--font-display);font-size:1.5rem;font-weight:700}
.person{display:flex;gap:12px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent);flex:none}
.ctx{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px}
.chart text{fill:var(--muted);font-family:var(--font-mono);font-size:11px}
.chart .grid-l{stroke:var(--line)}
.chart .tgt{stroke:var(--saffron);stroke-dasharray:4 4;stroke-width:1.5}
.chart .b{fill:var(--accent);opacity:.82}
.chart .b.last{opacity:1}
.chart .vl{fill:var(--fg);font-size:11px}
.done-state{opacity:.7}
.srcbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px}
.srcbar .btn{margin-left:auto}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);box-shadow:var(--shadow);display:grid;place-items:center}
.fab:hover{border-color:var(--accent)}
.fab-dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--good);border:2px solid var(--surface)}
.fab .spin{display:grid;animation:spin 1s linear infinite}
.fab-panel{position:fixed;right:16px;bottom:calc(142px + env(safe-area-inset-bottom,0px));z-index:41;width:min(320px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
@media (min-width:900px){.fab{bottom:24px;right:24px}.fab-panel{bottom:84px;right:24px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app"></div>

<script>

/* ---------- Shell ---------- */
const OWNER_NAV=[["gOverview",["home","brief","ask"]],["gBiz",["sales","collections","customers","team"]],["gAct",["actions","settings"]]];
const SALES_NAV=[["gOverview",["myday","ask"]],["gBiz",["sales","collections"]]];
function pendingCount(){ return Object.values(S.actions).filter(v=>v==="pending").length; }
function langSeg(){ return `<div class="seg" role="group" aria-label="${t("lang")}"><button data-act="lang" data-v="en" aria-pressed="${S.lang==="en"}">EN</button><button data-act="lang" data-v="hi" aria-pressed="${S.lang==="hi"}">हिं</button></div>`; }
function isDark(){ const a=document.documentElement.getAttribute("data-theme"); if(a) return a==="dark"; return matchMedia("(prefers-color-scheme: dark)").matches; }
function themeBtn(){ return `<button class="btn ghost sm" data-act="theme" aria-label="Switch theme">${I(isDark()?IC.sun:IC.moon,17)}</button>`; }

function shell(){
  const groups = S.role==="owner"?OWNER_NAV:SALES_NAV;
  const side = `<aside class="side"><div class="brand"><div class="logo">${I(IC.brain,18)}</div><b>Business Brain</b></div>
    ${groups.map(([g,items])=>`<nav class="nav-g" aria-label="${t(g)}"><span class="label">${t(g)}</span>${items.map(k=>`<button class="nav-i" data-act="go" data-v="${k}" ${S.screen===k?'aria-current="page"':""}>${I(IC[k])}<span>${t(k)}</span>${k==="actions"&&pendingCount()?`<span class="badge">${pendingCount()}</span>`:""}</button>`).join("")}</nav>`).join("")}
    <div class="side-foot">${I(IC.lock,14)} ${t("privacy")}</div></aside>`;
  const top = `<header class="top"><div class="top-in"><div class="logo mob-logo">${I(IC.brain,16)}</div><div class="grow"><div class="co">${esc(S.form.company)}</div><div class="small muted">${esc(S.form.city)} · ${h("Demo data","डेमो डेटा")}</div></div>
    ${S.role==="owner"?`<label class="small muted" for="roleSel" style="white-space:nowrap">${h("Preview as","इस रूप में देखें")}</label>
    <select id="roleSel" data-act-change="role" style="width:auto;padding:6px 10px;font-size:13.5px"><option value="owner" selected>${h("Me (Owner)","मैं (मालिक)")}</option>${D.team.map(p=>`<option value="${p.id}">${p.name.split(" ")[0]} (${h("Sales","सेल्स")})</option>`).join("")}</select>`:`<button class="btn sm primary" data-act="backOwner">${h("Exit preview","प्रीव्यू बंद करें")}</button>`}
    ${langSeg()} ${themeBtn()}</div></header>`;
  const mobItems = S.role==="owner"?["home","ask","sales","collections","more"]:["myday","ask","sales","collections"];
  const moreSet=["brief","customers","team","actions","settings"];
  const bnav = `<nav class="bnav" aria-label="Main">${mobItems.map(k=>`<button data-act="${k==="more"?"more":"go"}" data-v="${k}" ${(S.screen===k||(k==="more"&&moreSet.includes(S.screen)))?'aria-current="page"':""}>${I(IC[k],21)}<span>${({collections:h("Payments","वसूली"),ask:h("Ask","पूछें"),sales:h("Sales","बिक्री"),myday:h("My day","मेरा दिन")})[k]||t(k)}</span></button>`).join("")}</nav>`;
  let body="";
  try{ body = SCREENS[S.screen](); }catch(e){ body=`<p>Could not show this screen.</p>`; console.error(e); }
  const pv = S.role!=="owner"?person(S.role):null, pfn = pv?pv.name.split(" ")[0]:"";
  const banner = pv?`<div class="role-banner">${I(IC.eye,18)}<div class="grow"><b>${h(`You're previewing what ${pfn} sees.`,`आप देख रहे हैं कि ${pfn} को क्या दिखता है।`)}</b> ${h(`${pfn} sees only their own leads, customers and payments, and cannot switch views. Only you, the owner, can preview other people's screens.`,`${pfn} सिर्फ़ अपनी लीड्स, ग्राहक और पेमेंट देख सकते हैं और व्यू नहीं बदल सकते। सिर्फ़ आप (मालिक) दूसरों की स्क्रीन देख सकते हैं।`)}</div><button class="btn sm" data-act="backOwner">${h("Back to my view","अपने व्यू पर लौटें")}</button></div>`:"";
  return `<div class="shell">${side}<div style="min-width:0">${top}<main class="main">${banner}${body}</main></div></div>${bnav}${S.moreOpen?moreSheet():""}${S.role==="owner"?syncFab():""}${S.modal?modal():""}${S.compOpen?compSheet():""}${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:""}`;
}
function moreSheet(){
  return `<div class="scrim" data-act="closeMore"><div class="sheet" data-stop>${["brief","customers","team","actions","settings"].map(k=>`<button class="nav-i" data-act="go" data-v="${k}">${I(IC[k])}<span>${t(k)}</span>${k==="actions"&&pendingCount()?`<span class="badge">${pendingCount()}</span>`:""}</button>`).join("")}</div></div>`;
}
function pageH(title,sub,right=""){ return `<div class="page-h"><div><h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:""}</div>${right}</div>`; }
function kpi(label,v,delta,dir,foot){ return `<div class="kpi"><span class="label">${label}</span><span class="v">${v}</span><span class="delta ${dir}">${delta}</span>${foot?`<span class="small muted">${foot}</span>`:""}</div>`; }

/* ---------- Charts ---------- */
function monthChart(){
  const W=560,H=220,pl=40,pr=10,pt=18,pb=28,max=1.5;
  const iw=W-pl-pr, ih=H-pt-pb, n=D.months.length, bw=iw/n*0.56;
  const y=v=>pt+ih-(v/max)*ih;
  const MHI={Apr:"अप्रैल",May:"मई",Jun:"जून",Jul:"जुलाई",Aug:"अगस्त",Sep:"सितंबर"};
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${h("Monthly sales April to September 2026, in crore rupees, against a target of 1.24 crore","अप्रैल से सितंबर 2026 तक महीने की बिक्री, करोड़ रुपये में, 1.24 करोड़ के टारगेट के साथ")}">`;
  [0,0.5,1,1.5].forEach(v=>{ s+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v.toFixed(1)}</text>`; });
  D.months.forEach(([m,v],i)=>{ const cx=pl+iw/n*(i+.5); s+=`<rect class="b ${i===n-1?"last":""}" x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="4"/><text class="vl" x="${cx}" y="${y(v)-6}" text-anchor="middle">${v.toFixed(2)}</text><text x="${cx}" y="${H-8}" text-anchor="middle">${h(m,MHI[m])}</text>`; });
  s+=`<line class="tgt" x1="${pl}" x2="${W-pr}" y1="${y(D.target)}" y2="${y(D.target)}"/><text x="${W-pr}" y="${y(D.target)-6}" text-anchor="end" style="fill:var(--saffron)">${h("target","टारगेट")} 1.24</text></svg>`;
  return s;
}
function ageingBar(rows){
  const tot=rows.reduce((a,r)=>a+r[1],0);
  const lab=r=>h(r[0],r[0].replace("days","दिन"));
  return `<div class="ageing" role="img" aria-label="${h("Overdue by age","बकाया, कितना पुराना")}">${rows.map(r=>`<span style="width:${(r[1]/tot*100).toFixed(1)}%;background:${r[2]}"></span>`).join("")}</div>
  <div class="legend">${rows.map(r=>`<div><span class="muted"><span class="sw" style="background:${r[2]}"></span>${lab(r)}</span><b class="num">${L(r[1])}</b></div>`).join("")}</div>`;
}

  } else if(c.gst==="quarterly"){
    rows.push({id:"gstr1q",name:h("GSTR-1 (Jul–Sep quarter)","GSTR-1 (जुलाई–सितंबर तिमाही)"),date:new Date(2026,9,13)});
    rows.push({id:"gstr3bq",name:h("GSTR-3B (Jul–Sep quarter)","GSTR-3B (जुलाई–सितंबर तिमाही)"),date:new Date(2026,9,24)});
  }
  if(c.tds){
    rows.push({id:"tdsr",name:h("TDS return (Jul–Sep quarter)","TDS रिटर्न (जुलाई–सितंबर तिमाही)"),date:new Date(2026,9,31)});
    rows.push({id:"tdsd",name:h("TDS deposit (October)","TDS जमा (अक्टूबर)"),date:new Date(2026,10,7)});
  }
  c.items.forEach(it=>{ const [y,m,d]=it.date.split("-").map(Number); rows.push({id:it.id,name:esc(it.name),date:new Date(y,m-1,d)}); });
  return rows.sort((a,b)=>a.date-b.date).map(r=>{
    const days=Math.round((r.date-TODAY)/864e5), filed=!!c.filed[r.id];
    let status,k;
    if(filed){status=h("Filed","भर दिया");k="good";}
    else if(days<0){status=h(`Overdue by ${-days} days`,`${-days} दिन देर`);k="bad";}

    else {status=h("Upcoming","आने वाला");k="";}
    return {...r,dateL:fmtD(r.date),status,k,filed};
  });
}

/* A salesperson's day: late or due follow-ups first, then their overdue payments */
function myTasks(p){
  if(!p) return [];
  const f=D.followups.filter(x=>x.owner===p.id).map(x=>[`Follow up with ${x.who}`,`${x.what} · ${L(x.val)}`,x.state]);
  const c=D.invoices.filter(x=>x.owner===p.id).map(x=>[`Collect from ${x.cust}`,`${inr(x.amt)} · ${x.days} days${x.note?` · ${x.note}`:""}`,x.days>60?"bad":"warn"]);
  const rank={bad:0,warn:1,acc:2};
  return [...f,...c].sort((a,b)=>rank[a[2]]-rank[b[2]]).slice(0,5);
}

function answer(q){
  const s=q.toLowerCase();
  let best=null,score=0;
  ANSWERS.forEach(a=>{ const sc=a.k.reduce((n,k)=>n+(s.includes(k)?k.length:0),0); if(sc>score){score=sc;best=a;} });
  if(S.role!=="owner" && best && !["today","target","my payments"].some(k=>best.k.includes(k)) && !best.k.includes("my overdue")){
    if(/owe|overdue|payment|baki/.test(s)) best=ANSWERS.find(a=>a.k.includes("my payments"));
    else return `<p>As a salesperson you can ask about your own leads, customers and payments. Business-wide numbers are visible to the owner.</p>`;
  }
  if(!best) return `<p>In the full version, Business Brain answers this from your Tally, leads and WhatsApp data. In this demo, try one of the suggested questions below.</p>`;
  return (S.lang==="hi"||/[ऀ-ॿ]/.test(q)?best.hi():best.en()) + SRC(best.src);
}
function ask(q){
  q=q.trim(); if(!q||S.typing) return;
  S.chat.push({me:true,text:q}); S.typing=true; S.screen="ask"; render(); scrollChat();
  setTimeout(()=>{ S.typing=false; S.chat.push({html:answer(q)}); render(); scrollChat(); }, reduce()?50:900);
}

const root=document.getElementById("app");
let toastTimer;
function toast(msg){ S.toast=msg; render(); clearTimeout(toastTimer); toastTimer=setTimeout(()=>{S.toast="";render();},3200); }
function render(){
  const y=window.scrollY;
  const active=document.activeElement&&document.activeElement.id;
  root.innerHTML = S.stage==="onboard"?onboard():shell();
  if(active){ const el=document.getElementById(active); if(el&&el.tagName!=="BUTTON") el.focus({preventScroll:true}); }
  window.scrollTo(0,y);
}
function go(k){ S.screen=k; S.moreOpen=false; render(); window.scrollTo(0,0); }
function startProc(){
  S.proc=0; render();
  const tick=()=>{ if(S.stage!=="onboard"||S.step!==4) return; S.proc++; render(); if(S.proc<5) setTimeout(tick, reduce()?60:750); };
  setTimeout(tick, reduce()?60:750);
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el) return;
  if(el.matches(".scrim") && e.target!==el) return;
  const a=el.dataset.act, v=el.dataset.v;
  switch(a){
    case "skip": S.stage="app"; S.screen="home"; render(); window.scrollTo(0,0); break;
    case "obNext": S.step=Math.min(4,S.step+1); window.scrollTo(0,0); if(S.step===4) startProc(); else render(); break;
    case "obBack": S.step=Math.max(0,S.step-1); render(); break;
    case "obAdd": { const n=(S.form.newName||"").trim(); if(!n){ toast(h("Type a name first.","पहले नाम लिखें।")); break; } S.obTeam.push([n,S.form.newRole]); S.form.newName=""; render(); toast(h(`${n} added. They'll get an invite on WhatsApp (demo).`,`${n} जोड़ दिए गए। उन्हें WhatsApp पर इनवाइट जाएगा (डेमो)।`)); break; }
    case "obDel": S.obTeam.splice(+el.dataset.i,1); render(); break;
    case "src": S.sources[el.dataset.k]=!S.sources[el.dataset.k]; render(); break;
    case "enter": S.stage="app"; S.screen="home"; render(); window.scrollTo(0,0); break;
    case "go": go(v); break;
    case "more": S.moreOpen=true; render(); break;
    case "closeMore": S.moreOpen=false; render(); break;
    case "lang": S.lang=v; render(); break;
    case "theme": { const d=isDark(); document.documentElement.setAttribute("data-theme",d?"light":"dark"); render(); break; }
    case "ask": ask(v); break;
    case "remind": S.modal={id:v,tone:"polite",text:null}; render(); break;
    case "tone": S.modal.tone=v; S.modal.text=null; render(); break;
    case "closeModal": S.modal=null; render(); break;
    case "sendRem": { const id=S.modal.id; S.sent[id]=true; S.modal=null; toast("Reminder approved. Demo: no message was sent."); break; }
    case "act": { S.actions[v]=el.dataset.s; const msg=el.dataset.s==="approved"?"Approved. In the real product this action now runs.":el.dataset.s==="dismissed"?"Dismissed. Business Brain will learn from this.":"Moved back to waiting."; toast(msg); break; }
    case "custTab": S.custTab=v; render(); break;
    case "briefReply": S.briefReply=true; render(); break;
    case "locPick": S.locFilter=v; render(); window.scrollTo(0,0); break;
    case "locAdd": { const n=S.newLoc.trim(); if(!n){ toast(h("Type a city or branch name.","शहर या ब्रांच का नाम लिखें।")); break; } if(!S.locs.includes(n)) S.locs.push(n); S.newLoc=""; render(); break; }
    case "locDel": if(S.locs.length>1){ S.locs=S.locs.filter(x=>x!==v); if(S.locFilter===v) S.locFilter="all"; } render(); break;
    case "syncOpen": S.syncOpen=true; render(); break;
    case "syncClose": S.syncOpen=false; render(); break;
    case "syncNow": S.sync.busy=true; render(); setTimeout(()=>{ S.sync.busy=false; S.sync.last=Date.now(); toast(h(`Synced with ${S.acct}. No new payments since last sync.`,`${S.acct} से सिंक हो गया। पिछली बार के बाद कोई नया पेमेंट नहीं।`)); }, reduce()?100:1600); break;
    case "compOpen": S.compOpen=true; render(); break;
    case "compClose": S.compOpen=false; render(); break;
    case "compFiled": S.comp.filed[v]=!S.comp.filed[v]; render(); break;
    case "compDel": S.comp.items=S.comp.items.filter(x=>x.id!==v); render(); break;
    case "compAdd": { const n=S.compNew.name.trim(), d=S.compNew.date; if(!n||!d){ toast(h("Add a name and a date.","नाम और तारीख दोनों डालें।")); break; } S.comp.items.push({id:"c"+Date.now(),name:n,date:d}); S.compNew={name:"",date:""}; render(); break; }
    case "backOwner": S.role="owner"; S.screen="home"; S.chat=[]; render(); window.scrollTo(0,0); break;
    case "taskDone": S.done=S.done||{}; S.done[v]=true; render(); break;
  }
});
document.addEventListener("input",e=>{
  const f=e.target.dataset&&e.target.dataset.f; if(f){ S.form[f]=e.target.value; }
  if(e.target.id==="remText"&&S.modal){ S.modal.text=e.target.value; }
  if(e.target.id==="cName") S.compNew.name=e.target.value;
  if(e.target.id==="newLoc") S.newLoc=e.target.value;
  if(e.target.id==="cDate") S.compNew.date=e.target.value;
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.f){ S.form[el.dataset.f]=el.value; if(el.tagName==="SELECT") render(); }
  if(el.dataset.actChange==="role"){ S.role=el.value; S.screen=S.role==="owner"?"home":"myday"; S.chat=[]; render(); window.scrollTo(0,0); }
  if(el.dataset.actChange==="leadOwner"){ S.leadOwner=el.value; render(); }
  if(el.id==="locF"){ S.locFilter=el.value; render(); }
  if(el.id==="acctSel"){ S.acct=el.value; render(); }
  if(el.dataset.comp==="gst"){ S.comp.gst=el.value; render(); }
  if(el.dataset.comp==="tds"){ S.comp.tds=el.checked; render(); }
  if(el.id==="cDate") S.compNew.date=el.value;
  if(el.dataset.pick){ S.picks[el.dataset.pick][el.dataset.v]=el.checked; render(); }
  if(el.dataset.perm){ S.perms[el.dataset.perm]=el.checked; render(); }
  if(el.id==="xl"&&el.files&&el.files[0]){ S.excelName=el.files[0].name; S.sources.excel=true; render(); }
});
document.addEventListener("submit",e=>{
  if(e.target.id==="askForm"){ e.preventDefault(); const inp=document.getElementById("askIn"); const q=inp.value; inp.value=""; ask(q); setTimeout(()=>{const i=document.getElementById("askIn"); if(i) i.focus({preventScroll:true});},0); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&(S.modal||S.moreOpen||S.compOpen||S.syncOpen)){ S.modal=null; S.moreOpen=false; S.compOpen=false; S.syncOpen=false; render(); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render());
/* Keep "synced X min ago" fresh without re-rendering; auto-sync every 30 minutes */
setInterval(()=>{ if(Date.now()-S.sync.last>=30*60000) S.sync.last=Date.now(); document.querySelectorAll("[data-sync-ago]").forEach(el=>el.textContent=syncAgo()); },30000);

render();
})();
</script>
</body>
</html>
